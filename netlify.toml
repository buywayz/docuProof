[build]
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"
  included_files = [
    "netlify/functions/assets/**",
    "netlify/functions/data/**"
  ]

# Keep functions uncached while iterating
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

# Rewrite /verify → serverless function (no force flag allowed with status 200)
[[redirects]]
  from = "/verify"
  to = "/.netlify/functions/verify_page"
  status = 200

# Rewrite /v/:id → serverless function (no force flag allowed with status 200)
[[redirects]]
  from = "/v/:id"
  to = "/.netlify/functions/verify_page?id=:id"
  status = 200