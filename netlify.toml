[build]
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  # Disable Netlify's build-time secrets scanner for this site.
  # This stops the false positives from .netlify/state.json and cached google-cloud-sdk files.
  SECRETS_SCAN_ENABLED = "false"

[functions]
  node_bundler   = "esbuild"
  included_files = [
    "netlify/functions/assets/**",
    "netlify/functions/data/**"
  ]

# Disable caching for all functions
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
    CDN-Cache-Control = "no-store"
    Netlify-CDN-Cache-Control = "no-store"

# Homepage redirects to prelaunch landing page
[[redirects]]
  from = "/"
  to = "/start.html"
  status = 200
  force = true

[[redirects]]
  from = "/verify"
  to = "/.netlify/functions/verify_page"
  status = 200
  force = true

[[redirects]]
  from = "/v/:id"
  to = "/.netlify/functions/verify_page?id=:id"
  status = 200
  force = true

# Scheduled function to resolve Bitcoin anchors every hour
[functions."resolve_cron"]
  schedule = "@hourly"

# Daily headline PDF generator - runs at 9am EST (2pm UTC) every day
# NOTE: Function name uses UNDERSCORES to match the filename
[functions."generate_daily_headline"]
  schedule = "0 14 * * *"
